# How long the card PIN stays cached. 10 minutes of activity, 2 hours hard cap
# -- long enough for a rebase, short enough that an unattended laptop re-asks.
default-cache-ttl 600
max-cache-ttl 7200

# Under Sway the GTK pinentry is the one that reliably gets keyboard focus;
# pinentry-curses is the fallback for a purely terminal session.
pinentry-program /usr/bin/pinentry-gnome3
