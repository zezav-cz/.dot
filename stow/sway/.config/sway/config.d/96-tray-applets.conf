# Tray applets (network, bluetooth)
#
# Ubuntu ships nm-applet.desktop in /etc/xdg/autostart, but nothing on this
# system processes those entries: 95-xdg-desktop-autostart.conf can only start
# sway-xdg-autostart.target, which is Fedora-only and is deliberately a no-op
# here. So the applets never start and waybar's tray stays empty.
#
# Start them explicitly, after the same StatusNotifierWatcher wait 95-* uses --
# an SNI applet that registers before a tray host exists falls back to the old
# XEmbed protocol, which Wayland has no support for, and its icon never shows.
#
# `pgrep -x` guards keep this safe on a distro that *does* run the autostart
# entries (Fedora), and make exec_always safe: a `swaymsg reload` re-launches
# only the applets that are actually gone.
#
# nm-applet --indicator forces the SNI/AppIndicator backend instead of letting
# it decide by desktop environment; without it the icon can silently not appear
# under a bare wlroots session.
exec_always sh -c '\
    i=0; \
    while [ $i -lt 50 ]; do \
        busctl --user get-property org.kde.StatusNotifierWatcher \
            /StatusNotifierWatcher org.kde.StatusNotifierWatcher \
            IsStatusNotifierHostRegistered 2>/dev/null | grep -q true && break; \
        i=$((i + 1)); sleep 0.5; \
    done; \
    command -v nm-applet >/dev/null && ! pgrep -x nm-applet >/dev/null && nm-applet --indicator & \
    command -v blueman-applet >/dev/null && ! pgrep -x blueman-applet >/dev/null && blueman-applet & \
    wait \
'
