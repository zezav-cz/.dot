# Key bindings to control PulseAudio/PipeWire volume with pactl.
# Displays a notification with the current state if notify-send is available.
#
# Volume increase/decrease step can be customized by setting the `$volume_step`
# variable to a numeric value before including the file.
# Maximum volume boost level can be set with the `$volume_limit` variable
# (see config.d/variables.conf).
#
# Requires:     pulseaudio-utils (pactl)
# Recommends:   libnotify-bin (notify-send)
#
# Ported from Fedora's /usr/share/sway/config.d/60-bindings-volume.conf.
# ADAPTATION: the Fedora original shells out to
# /usr/libexec/sway/volume-helper, a helper script shipped only by Fedora's
# sway packaging (no such path/package exists on Ubuntu). Its clamp/step/
# notify logic is reimplemented below with plain pactl + POSIX shell so this
# fragment is portable to any distro that has pulseaudio-utils installed.

set $volume_notify_cmd command -v notify-send >/dev/null && \
        LINE=$(pactl get-sink-volume @DEFAULT_SINK@) && LINE=${LINE%%%*} && VOL=${LINE##* } && \
        MUTE=$(pactl get-sink-mute @DEFAULT_SINK@) && \
        case "$MUTE" in *yes) TEXT="Volume: muted" ;; *) TEXT="Volume: ${VOL}%" ;; esac && \
        notify-send -e -h string:x-canonical-private-synchronous:volume \
            -h "int:value:${VOL:-0}" -t 800 "$TEXT"

# Allow volume controls even if the screen is locked
bindsym --locked {
    XF86AudioRaiseVolume exec \
        'LIMIT="$volume_limit" && STEP="$volume_step" && \
          LINE=$(pactl get-sink-volume @DEFAULT_SINK@) && LINE=${LINE%%%*} && CUR=${LINE##* } && \
          NEW=$((CUR + ${STEP:-5})) && [ "$NEW" -gt "${LIMIT:-100}" ] && NEW=${LIMIT:-100}; \
          pactl set-sink-volume @DEFAULT_SINK@ "${NEW}%" && $volume_notify_cmd'
    XF86AudioLowerVolume exec \
        'STEP="$volume_step" && \
          LINE=$(pactl get-sink-volume @DEFAULT_SINK@) && LINE=${LINE%%%*} && CUR=${LINE##* } && \
          NEW=$((CUR - ${STEP:-5})) && [ "$NEW" -lt 0 ] && NEW=0; \
          pactl set-sink-volume @DEFAULT_SINK@ "${NEW}%" && $volume_notify_cmd'
    XF86AudioMute    exec pactl set-sink-mute @DEFAULT_SINK@ toggle && $volume_notify_cmd
    XF86AudioMicMute exec pactl set-source-mute @DEFAULT_SOURCE@ toggle
}
