# Create or update XDG user dir configuration
#
# See also:
#  - /etc/xdg/autostart/xdg-user-dirs.desktop
#  - https://github.com/systemd/systemd/issues/18791
#
# Recommends: xdg-user-dirs
#
# Ported verbatim from Fedora's /usr/share/sway/config.d/95-xdg-user-dirs.conf.
# No Fedora-only binary here: /usr/bin/xdg-user-dirs-update is the same path
# on Ubuntu (package: xdg-user-dirs).

exec /usr/bin/xdg-user-dirs-update
