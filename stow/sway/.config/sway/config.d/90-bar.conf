# Status Bar: waybar (systemd user service)
#
# Requires: waybar
#
# waybar runs as the packaged systemd user unit (waybar.service) instead of a
# sway `bar {}` block: swaybar_command mangles quoted inline commands (sway's
# config tokenizer strips quotes and appends "-b <bar-id>") and gives no logs
# when the child dies. The unit gives journal logs (`journalctl --user -u
# waybar`) and Restart=on-failure.
#
# Ubuntu enables waybar.service for *every* graphical session via
# /etc/systemd/user/graphical-session.target.wants, which crash-loops it under
# GNOME/GDM (no wlr-layer-shell). The sway-portability ansible role disables
# that global enablement; the stowed sway-session.target (systemd stow
# package) pulls waybar in for sway sessions only.
#
# Ordering matters: WAYLAND_DISPLAY must be in the systemd user environment
# before the session target starts, or waybar's xdg-desktop-portal appearance
# query hangs ("cannot open display"). Chain import -> start in one shell so
# separate exec lines cannot race. `restart` (not `start`) because the user
# manager outlives the session: after a re-login the target can still be
# active with a dead waybar under it.
exec sh -c 'systemctl --user import-environment DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP XDG_SESSION_TYPE; dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP XDG_SESSION_TYPE; systemctl --user reset-failed waybar.service xdg-desktop-portal.service xdg-desktop-portal-gtk.service 2>/dev/null; systemctl --user restart sway-session.target'
