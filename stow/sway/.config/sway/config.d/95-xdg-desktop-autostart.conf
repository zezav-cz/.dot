# Wait until a StatusNotifierItem tray implementation is available and
# process XDG autostart entries.
#
# This horror has to exist because
#
#  - SNI spec mandates that if `IsStatusNotifierHostRegistered` is not set,
#    the client should fall back to the Freedesktop System Tray specification
#    (XEmbed).
#  - There are actual implementations that take this seriously and implement
#    a fallback *even if* StatusNotifierWatcher is already DBus-activated.
#  - https://github.com/systemd/systemd/issues/3750
#
# Ported from Fedora's /usr/share/sway/config.d/95-xdg-desktop-autostart.conf.
# ADAPTATION: the Fedora original delegates the wait to
# /usr/libexec/sway-systemd/wait-sni-ready (a Python helper shipped by
# Fedora's sway-systemd package, not packaged on Ubuntu) and then starts the
# sway-xdg-autostart.target systemd user unit (also Fedora-only; no such unit
# is shipped on Ubuntu). Replaced below with a portable busctl poll for the
# same DBus condition (busctl ships with systemd on both distros); the
# target-start is guarded so it is a silent no-op on distros that don't ship
# the unit, and starts it normally on Fedora where it does.
exec sh -c '\
    i=0; \
    while [ $i -lt 50 ]; do \
        busctl --user get-property org.kde.StatusNotifierWatcher \
            /StatusNotifierWatcher org.kde.StatusNotifierWatcher \
            IsStatusNotifierHostRegistered 2>/dev/null | grep -q true && break; \
        i=$((i + 1)); sleep 0.5; \
    done; \
    systemctl --user list-unit-files sway-xdg-autostart.target >/dev/null 2>&1 && \
        systemctl --user start sway-xdg-autostart.target \
'
