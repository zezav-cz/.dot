# Backend routing for xdg-desktop-portal under Sway.
#
# Screen sharing (Firefox/Chromium -> getDisplayMedia -> portal) needs an
# impl.portal.ScreenCast provider. The gtk backend does not implement it and
# the gnome one needs Mutter, so without this both fail and browsers report
# "permission denied". Route ScreenCast/Screenshot to xdg-desktop-portal-wlr
# and leave everything else (file chooser, notifications, settings) to gtk.
#
# The wlr.portal file still carries UseIn=sway, but UseIn is deprecated in
# xdg-desktop-portal >= 1.17 -- this file is the supported way to say it.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
