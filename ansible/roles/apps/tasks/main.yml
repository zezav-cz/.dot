---
# Ubuntu 24.04+ restricts unprivileged user namespaces via AppArmor, which
# breaks the Chromium sandbox in Electron AppImages (Obsidian, Signal,
# Headlamp): they fall back to the SUID sandbox, which cannot be setuid-root
# inside the /tmp AppImage mount, and abort. Re-allowing unprivileged userns
# keeps the sandbox working (via namespaces) — safer than --no-sandbox.
- name: Check for the apparmor unprivileged-userns restriction knob
  ansible.builtin.stat:
    path: /proc/sys/kernel/apparmor_restrict_unprivileged_userns
  register: userns_knob

- name: Allow unprivileged user namespaces (Electron/AppImage sandbox)
  become: true
  ansible.posix.sysctl:
    name: kernel.apparmor_restrict_unprivileged_userns
    value: '0'
    sysctl_file: /etc/sysctl.d/99-unprivileged-userns.conf
    state: present
    reload: true
  when: userns_knob.stat.exists

- name: Ensure app directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ appimage_dir }}"
    - "{{ desktop_dir }}"
    - "{{ icon_dir }}"

- name: Download AppImages
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ appimage_dir }}/{{ item.name }}"
    mode: '0755'
  loop: "{{ apps }}"
  loop_control: { label: "{{ item.name }}" }

- name: Download Signal signing key
  ansible.builtin.get_url:
    url: "https://updates.signal.org/static/desktop/appimage.asc"
    dest: /tmp/signal-key.asc
    mode: '0644'

- name: Download Signal signature
  ansible.builtin.get_url:
    url: "https://updates.signal.org/desktop/signal-desktop.AppImage.gpg"
    dest: /tmp/signal-desktop.AppImage.gpg
    mode: '0644'

- name: Verify Signal AppImage signature
  ansible.builtin.shell:
    cmd: >
      gpg --no-default-keyring --keyring /tmp/signal-verify.gpg --import /tmp/signal-key.asc &&
      gpgv --keyring /tmp/signal-verify.gpg /tmp/signal-desktop.AppImage.gpg {{ appimage_dir }}/signal-desktop
  changed_when: false

- name: Download app icons (cosmetic, never fatal)
  ansible.builtin.get_url:
    url: "{{ item.icon_url }}"
    dest: "{{ icon_dir }}/{{ item.name }}{{ item.icon_url | regex_search('\\.[a-zA-Z0-9]+$') | default('.png', true) }}"
    mode: '0644'
  loop: "{{ apps | selectattr('icon_url', 'defined') | list }}"
  loop_control: { label: "{{ item.name }}" }
  failed_when: false

- name: Install desktop entries
  ansible.builtin.template:
    src: app.desktop.j2
    dest: "{{ desktop_dir }}/{{ item.name }}.desktop"
    mode: '0644'
  loop: "{{ apps }}"
  loop_control: { label: "{{ item.name }}" }

# --- Telegram Desktop -------------------------------------------------------
# Not an AppImage: the release tarball unpacks to Telegram/Telegram. Installed
# under ~/.local/opt with a version marker so re-runs are no-ops and upgrades
# happen only when telegram_version is bumped. Note: installed in a writable
# dir, Telegram will also self-update in place; the marker then just records
# the version ansible last installed.
- name: Check installed Telegram version marker
  ansible.builtin.stat:
    path: "{{ opt_dir }}/Telegram/.ansible-version-{{ telegram_version }}"
  register: telegram_marker

- name: Ensure ~/.local/opt exists
  ansible.builtin.file:
    path: "{{ opt_dir }}"
    state: directory
    mode: '0755'

- name: Download Telegram release tarball
  ansible.builtin.get_url:
    url: "{{ telegram_url }}"
    dest: "/tmp/tsetup.{{ telegram_version }}.tar.xz"
    mode: '0644'
  when: not telegram_marker.stat.exists

- name: Unpack Telegram into ~/.local/opt
  ansible.builtin.unarchive:
    src: "/tmp/tsetup.{{ telegram_version }}.tar.xz"
    dest: "{{ opt_dir }}"
    remote_src: true
  when: not telegram_marker.stat.exists

- name: Stamp installed Telegram version
  ansible.builtin.file:
    path: "{{ opt_dir }}/Telegram/.ansible-version-{{ telegram_version }}"
    state: touch
    mode: '0644'
  when: not telegram_marker.stat.exists

- name: Symlink telegram into ~/.local/bin
  ansible.builtin.file:
    src: "{{ opt_dir }}/Telegram/Telegram"
    dest: "{{ appimage_dir }}/telegram"
    state: link

- name: Download Telegram icon (cosmetic, never fatal)
  ansible.builtin.get_url:
    url: "https://telegram.org/img/t_logo.png"
    dest: "{{ icon_dir }}/telegram.png"
    mode: '0644'
  failed_when: false

- name: Install Telegram desktop entry
  ansible.builtin.template:
    src: app.desktop.j2
    dest: "{{ desktop_dir }}/telegram.desktop"
    mode: '0644'
  vars:
    item:
      name: telegram
      display_name: Telegram
      icon_url: "https://telegram.org/img/t_logo.png"
      categories: "Network;InstantMessaging;"
      wm_class: TelegramDesktop
# ----------------------------------------------------------------------------

- name: Mask dunst (prevents it replacing swaync)
  ansible.builtin.systemd:
    name: dunst.service
    masked: true
    scope: user
  failed_when: false

- name: Mask swaync's own systemd user unit (crash-loops racing sway's exec swaync)
  ansible.builtin.systemd:
    name: swaync.service
    masked: true
    scope: user
  failed_when: false
  # Ubuntu ships a swaync.service user unit that races the sway config's
  # `exec swaync` for the org.freedesktop.Notifications D-Bus name and
  # crash-loops. Masking the unit leaves the real, working instance
  # (launched by sway's exec line) as the sole notification daemon.
