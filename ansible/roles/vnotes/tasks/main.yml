---
# vnotes is a private repo; the git-clone role handles SSH auth (local
# agent or forwarded agent). Skip entirely with --skip-tags vnotes.
- name: Clone/update vnotes repo
  ansible.builtin.include_role:
    name: git-clone
  vars:
    git_clone_repo: "zezav-cz/vnotes"
    git_clone_dest: "{{ ansible_env.HOME }}/vnotes"
    git_clone_version: main
