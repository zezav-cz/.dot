---
# vnotes is private, cloned over SSH using the system's existing SSH key
# (the operator guarantees a GitHub-authorised key + agent on the target).
- name: Clone/update vnotes repo
  ansible.builtin.git:
    repo: "git@github.com:zezav-cz/vnotes.git"
    dest: "{{ ansible_env.HOME }}/vnotes"
    version: main
    accept_hostkey: true
    update: true
