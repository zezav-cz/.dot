---
- name: Ensure font extract dirs exist
  ansible.builtin.file:
    path: "{{ fonts_dir }}/{{ item.extract_dir }}"
    state: directory
    mode: '0755'
  loop: "{{ fonts }}"
  loop_control: { label: "{{ item.name }}" }

- name: Download and extract fonts
  ansible.builtin.unarchive:
    src: "{{ item.url }}"
    dest: "{{ fonts_dir }}/{{ item.extract_dir }}"
    remote_src: true
    creates: "{{ fonts_dir }}/{{ item.extract_dir }}/.extracted"
  loop: "{{ fonts }}"
  loop_control: { label: "{{ item.name }}" }
  register: font_extract
  notify:
    - Mark extracted fonts (idempotency sentinel)
    - Refresh font cache

- name: Flush font handlers immediately (subsequent roles expect fonts ready)
  ansible.builtin.meta: flush_handlers
