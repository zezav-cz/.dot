---
packages_full_repos:
  - name: vscode
    key_url: https://packages.microsoft.com/keys/microsoft.asc
    keyring: /etc/apt/keyrings/microsoft.gpg
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/code stable main"
    filename: vscode
  - name: mise
    key_url: https://mise.jdx.dev/gpg-key.pub
    keyring: /etc/apt/keyrings/mise.gpg
    repo: "deb [signed-by=/etc/apt/keyrings/mise.gpg arch=amd64] https://mise.jdx.dev/deb stable main"
    filename: mise
  - name: tailscale
    # Not in the Ubuntu archive. Tailscale's own repo, ASCII-armored key
    # variant (fits the same download+dearmor pattern as vscode/mise
    # above; the "noarmor" variant on the same host is already binary and
    # would break gpg --dearmor). Uses ansible_distribution_release so
    # this tracks whatever codename the target box is actually on.
    # Verified live against the KVM's current codename (resolute): both
    # the key URL and the resulting repo's Release file return HTTP 200.
    key_url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.gpg"
    keyring: /etc/apt/keyrings/tailscale.gpg
    repo: "deb [signed-by=/etc/apt/keyrings/tailscale.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ ansible_distribution_release }} main"
    filename: tailscale

packages_full:
  # VCS & tools
  - git
  - git-delta
  - git-lfs
  - tig
  - lazygit # config-tool audit: stow/zsh/.zshrc `alias lg='lazygit'`
  # Languages & build
  - ruby
  - ruby-dev
  - golang-go
  - mise # from jdx apt repo, see packages_full_repos
  - cmake
  # CLI utils
  - wget
  - curl
  - fzf
  - bat # binary installed as /usr/bin/batcat; shimmed below as ~/.local/bin/bat
  - fd-find # binary installed as /usr/bin/fdfind; shimmed below as ~/.local/bin/fd
  - ripgrep # config-tool audit: nvim telescope.lua live_grep + zsh fzf integration; binary is `rg`, no rename
  - code # from Microsoft apt repo, see packages_full_repos
  # Editors
  - vim
  - neovim
  # Dotfile management
  - stow
  # Fonts (extraction + cache tooling for the fonts role, Task 12)
  - unzip # unarchive of the .zip font releases needs the unzip binary on the target
  - fontconfig # provides fc-cache; present transitively today but not guaranteed
  # Shell
  - zsh # not in Fedora's list (Sway Spin ships it in the base image); Ubuntu needs it explicit
  # Containers
  - podman
  # Networking
  - tailscale # from tailscale.com apt repo, see packages_full_repos; config: sway config `exec sleep 3 && tailscale systray`
  # Sway / Wayland utilities
  - waybar # not in Fedora's list (Sway Spin ships it in the base image); Ubuntu needs it explicit
  - rofi # config-tool audit: sway config.d/variables.conf `$menu`/`$rofi_cmd`, $mod+d launcher, clipboard/recording pickers
  - rofimoji
  - kanshi # config-tool audit: sway config `exec kanshi` (output/profile management)
  - grim
  - slurp
  - wf-recorder
  - swappy
  - wl-clipboard
  - geoclue-2.0
  - gammastep
  - nwg-bar
  - nwg-displays
  - sway-notification-center
  - brightnessctl
  - playerctl
  - swayidle
  - swaylock
  - pulseaudio-utils
  - pavucontrol # config-tool audit: waybar config.jsonc pulseaudio module `"on-click": "pavucontrol"`
  - bluez # config-tool audit: waybar config.jsonc bluetooth module `"on-click": "foot -e bluetoothctl"`
  - libnotify-bin
  - grimshot
  # FUSE (for AppImages) - fuse3 pulls in the runtime lib automatically,
  # no separate fuse-libs equivalent needed
  - fuse3
  # Clipboard
  - cliphist
  # SSH
  - ssh-askpass
  # Build dependencies
  - zlib1g-dev
  - libffi-dev
  - libreadline-dev
  - libssl-dev
  - make
  - gcc
  - patch
  - autoconf
  - automake
  - bison
  - libtool
  - libsqlite3-dev
  - libyaml-dev
  - libpcap-dev
  - libusb-1.0-0-dev
  # Cockpit
  - cockpit-packagekit
  - cockpit-podman
  - cockpit-storaged
  - cockpit-networkmanager
  - pcp
  - python3-pcp
  # Misc
  - libdbus-glib-1-2
  # Games
  - prismlauncher

# Config-tool audit: Ubuntu ships a handful of packages under a renamed
# binary (usually because the plain name was already taken by an older,
# unrelated Debian package). The stowed zsh/nvim configs invoke the
# upstream-conventional name (`bat`, `fd`), not the Ubuntu one, so we shim
# the expected name onto the real binary. Symlinks land in ~/.local/bin,
# which is already on jan's PATH for the graphical session (confirmed live
# via /proc/<sway-pid>/environ) courtesy of
# stow/systemd/.config/environment.d/path.conf.
packages_full_shims:
  - name: bat
    target: /usr/bin/batcat
  - name: fd
    target: /usr/bin/fdfind
