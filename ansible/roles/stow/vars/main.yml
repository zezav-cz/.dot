---
# GitHub username; can be overridden with -e github_user=<user> at runtime
github_user: "zezav-cz"

stow_repo: "{{ github_user }}/.dot"
stow_version: ubuntu
stow_dest: "{{ ansible_env.HOME }}/.dot"
stow_packages:
  - ccstatusline
  - git
  - mise
  - nvim
  - rofi
  - ssh-agent
  - sway
  - systemd
  - tmux
  - zsh
  - foot
  - k9s
  - nwg-displays
stow_no_folding:
  - claude
  - claude-personal
  - my-scripts
  - pgcli
  - vscode
lazy_nvim_repo: "https://github.com/folke/lazy.nvim.git"
lazy_nvim_path: "{{ ansible_env.HOME }}/.local/share/nvim/lazy/lazy.nvim"
