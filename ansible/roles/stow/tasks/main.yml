---
- name: Clone/update the .dot repo
  ansible.builtin.include_role:
    name: git-clone
  vars:
    git_clone_repo: "{{ stow_repo }}"
    git_clone_dest: "{{ stow_dest }}"
    git_clone_version: "{{ stow_version }}"

- name: Stat ~/.zshrc
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.zshrc"
  register: zshrc_stat

- name: Back up a non-symlink ~/.zshrc
  ansible.builtin.command:
    cmd: "mv {{ ansible_env.HOME }}/.zshrc {{ ansible_env.HOME }}/.zshrc.bak.{{ ansible_date_time.epoch }}"
  when: zshrc_stat.stat.exists and zshrc_stat.stat.isreg and not zshrc_stat.stat.islnk
  changed_when: true
  # Guard: only move a real file. A stowed .zshrc is a symlink and must be
  # left alone on re-runs so this stays idempotent. changed_when: true is
  # correct here (not a lint suppression) — the `when:` already restricts
  # this task to the one case where it truly performs a change (moving a
  # real file out of the way); it can never run as a no-op.

- name: Stat ~/.config/sway
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.config/sway"
  register: sway_config_stat

- name: Remove phase-1 plain sway config files so stow can symlink
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/sway"
    state: absent
  when: sway_config_stat.stat.exists and not sway_config_stat.stat.islnk
  # sway-minimal wrote plain files here; stow needs a clean target to link into.
  # This is safe: the authoritative config now comes from the repo.
  # Guard: once stow has folded ~/.config/sway into a symlink, leave it alone
  # on re-runs — otherwise this would tear it down and force a needless
  # relink every time, breaking idempotency.

- name: Stat Claude Code files the claude package manages
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/{{ item }}"
  loop: "{{ claude_stow_conflicts }}"
  register: claude_stats

- name: Back up non-symlink Claude Code files so stow can link
  ansible.builtin.command:
    cmd: "mv {{ item.stat.path }} {{ item.stat.path }}.bak.{{ ansible_date_time.epoch }}"
  loop: "{{ claude_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists and item.stat.isreg and not item.stat.islnk
  changed_when: true
  # Same guard pattern as ~/.zshrc above: only a real file is moved; once
  # stowed these are symlinks and are left alone on re-runs.

- name: Stow folded packages
  ansible.builtin.command:
    cmd: "stow -d {{ stow_dest }}/stow -t {{ ansible_env.HOME }} --restow {{ item }}"
  loop: "{{ stow_packages }}"
  register: stow_folded
  changed_when: "'LINK' in stow_folded.stderr or 'UNLINK' in stow_folded.stderr"

- name: Stow no-folding packages
  ansible.builtin.command:
    cmd: "stow -d {{ stow_dest }}/stow -t {{ ansible_env.HOME }} --no-folding --restow {{ item }}"
  loop: "{{ stow_no_folding }}"
  register: stow_nofold
  changed_when: "'LINK' in stow_nofold.stderr or 'UNLINK' in stow_nofold.stderr"

- name: Clone lazy.nvim
  ansible.builtin.git:
    repo: "{{ lazy_nvim_repo }}"
    dest: "{{ lazy_nvim_path }}"
    version: stable
    depth: 1
    update: false
