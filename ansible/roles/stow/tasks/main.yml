---
# Running this play locally from inside the ~/.dot checkout makes the clone a
# self-update: git would refuse on any uncommitted change and would hard-switch
# the branch out from under the working tree. In that case the checkout we are
# standing in IS the source of truth, so skip the clone and stow from it.
# Remote runs (ssh connection) always clone -- playbook_dir there is the
# controller's path, never the target's.
- name: Detect whether the play runs from the ~/.dot checkout itself
  ansible.builtin.set_fact:
    stow_self_hosted: >-
      {{ (ansible_connection | default('ssh')) == 'local'
         and playbook_dir.startswith(stow_dest ~ '/') }}

- name: Report that the local checkout is used as-is
  ansible.builtin.debug:
    msg: "Running from {{ stow_dest }} itself -- skipping clone, stowing the working tree as-is."
  when: stow_self_hosted | bool

- name: Clone/update the .dot repo
  ansible.builtin.include_role:
    name: git-clone
  vars:
    git_clone_repo: "{{ stow_repo }}"
    git_clone_dest: "{{ stow_dest }}"
    git_clone_version: "{{ stow_version }}"
  when: not (stow_self_hosted | bool)

- name: Stat ~/.config/sway
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.config/sway"
  register: sway_config_stat

- name: Remove phase-1 plain sway config files so stow can symlink
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/sway"
    state: absent
  when: sway_config_stat.stat.exists and not sway_config_stat.stat.islnk
  # sway-minimal wrote plain files here; stow needs a clean target to link into.
  # This is safe: the authoritative config now comes from the repo.
  # Guard: once stow has folded ~/.config/sway into a symlink, leave it alone
  # on re-runs — otherwise this would tear it down and force a needless
  # relink every time, breaking idempotency.

# Any pre-existing REAL file where a stow package wants to place a symlink
# aborts the whole package ("neither a link nor a directory"). Rather than
# hand-listing every such file (~/.zshrc, ~/.config/git/ignore, the files
# Claude Code writes on first run...), ask stow itself: a --simulate pass
# reports every conflict, and each conflicting regular file is moved aside
# to <path>.bak.<epoch>. Idempotent: once stowed these are symlinks, which
# stow accepts, so the simulation comes back clean on re-runs.
- name: Simulate stowing folded packages to discover conflicting targets
  ansible.builtin.command:
    cmd: "stow -d {{ stow_dest }}/stow -t {{ ansible_env.HOME }} --simulate --restow {{ item }}"
  loop: "{{ stow_packages }}"
  register: stow_simulate_folded
  changed_when: false
  failed_when: false

- name: Simulate stowing no-folding packages to discover conflicting targets
  ansible.builtin.command:
    cmd: "stow -d {{ stow_dest }}/stow -t {{ ansible_env.HOME }} --simulate --no-folding --restow {{ item }}"
  loop: "{{ stow_no_folding }}"
  register: stow_simulate_nofold
  changed_when: false
  failed_when: false

- name: Collect conflicting target paths
  ansible.builtin.set_fact:
    stow_conflict_paths: >-
      {{ (stow_simulate_folded.results + stow_simulate_nofold.results)
         | map(attribute='stderr') | join('\n')
         | regex_findall('over existing target ([^ ]+) since')
         | unique }}

- name: Stat conflicting targets
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/{{ item }}"
  loop: "{{ stow_conflict_paths }}"
  register: stow_conflict_stats

- name: Back up conflicting regular files so stow can link
  ansible.builtin.command:
    cmd: "mv {{ item.stat.path }} {{ item.stat.path }}.bak.{{ ansible_date_time.epoch }}"
  loop: "{{ stow_conflict_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists and item.stat.isreg and not item.stat.islnk
  changed_when: true
  # changed_when: true is correct (not a lint suppression) -- the `when:`
  # already restricts this to the one case where it truly changes something.

- name: Stow folded packages
  ansible.builtin.command:
    cmd: "stow -d {{ stow_dest }}/stow -t {{ ansible_env.HOME }} --restow {{ item }}"
  loop: "{{ stow_packages }}"
  register: stow_folded
  changed_when: "'LINK' in stow_folded.stderr or 'UNLINK' in stow_folded.stderr"

- name: Stow no-folding packages
  ansible.builtin.command:
    cmd: "stow -d {{ stow_dest }}/stow -t {{ ansible_env.HOME }} --no-folding --restow {{ item }}"
  loop: "{{ stow_no_folding }}"
  register: stow_nofold
  changed_when: "'LINK' in stow_nofold.stderr or 'UNLINK' in stow_nofold.stderr"

- name: Clone lazy.nvim
  ansible.builtin.git:
    repo: "{{ lazy_nvim_repo }}"
    dest: "{{ lazy_nvim_path }}"
    version: stable
    depth: 1
    update: false
