# Managed by ~/.dot (ansible role "logind").
# Closing the lid on external power only locks the screen (sway's lid:on
# binding), so the always-on Claude Remote Control servers stay reachable.
# On battery the lid still suspends, so the laptop does not drain in a bag.
# Docked (external monitor) is already ignore by default.
[Login]
HandleLidSwitchExternalPower=ignore
